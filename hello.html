<!DOCTYPE html>
<html lang = "fr">

<head>
	<meta http-equiv = "content-type" content = "text/html; charset = UTF-8">
	<title> Activité d'introduction à GET</title>
	
	<link rel = "stylesheet" href = "hello.css">
	<script language = "javascript">
		var nbClic = 0;
		function compteClic() {
		nbClic++;
		document.getElementById('texte1').value=nbClic;
		}
		function decompteClic() {
		nbClic--;
		document.getElementById('texte1').value=nbClic;
		} 
		function razClic() {
		nbClic = 0;
		document.getElementById('texte1').value=nbClic;
		}
	</script>
</head>

<body>
	<div id = "top banner">
		Bienvenue dans ce cours GIT pour <br> BTS CIEL Session 2027  !
	</div>
	
	<div style = "text-algn:center" > Cliquer sur le bouton : 
	<input type = "button" value = "Cliquer pour augmenter" onClick = "compteClic()"><br>
	<input type = "button" value = "Cliquer pour reduire" onClick = "decompteClic()"><br>
	<input type = "button" value = "Cliquer pour RAZ" onClick = "razClic()"><br>
	Vous avez cliqué <input type = "text" id = "texte1" readonly = "true"> fois. </div>
</body>

</html>
